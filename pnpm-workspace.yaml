packages:
  - block
  - kind
  - liabilities-calc-script
  - model
  - ui
  - workflow

catalog:
  # SDK packages - EXACT VERSIONS (no ^ or ~)
  '@milaboratories/ts-builder': 1.8.0
  '@milaboratories/ts-configs': 1.4.1
  '@platforma-sdk/workflow-tengo': 6.22.2
  '@platforma-sdk/model': 1.88.15
  '@platforma-sdk/ui-vue': 1.88.15
  '@platforma-sdk/tengo-builder': 4.1.21
  '@platforma-sdk/package-builder': 3.17.0
  '@platforma-sdk/block-tools': 2.19.1
  '@platforma-sdk/test': 1.88.15
  '@milaboratories/helpers': 1.14.7
  '@milaboratories/strings': 0.1.2

  # Block-specific dependencies
  "@platforma-open/milaboratories.runenv-python-3": ^1.4.9

  # Common dependencies - can use ^ or ~
  'vue': 3.5.44
  '@vueuse/core': ^13.6.0
  'typescript': ~5.6.3
  'turbo': ~2.11.10
  'vitest': ^4.0.7
  'shx': ^0.4.0
  '@changesets/cli': ^2.29.8
  "@platforma-sdk/block-kind": 1.1.1
  cross-env: ~10.1.0
minimumReleaseAgeExclude:
  - "@milaboratories/*"
  - "@platforma-sdk/*"
  - "@platforma-open/*"
allowBuilds:
  "@milaboratories/tengo-tester": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  "@milaboratories/pframes-rs-node": true
